
<!DOCTYPE html>
<html>
<head>
    <title>Tabel Perkalian 8</title>
</head>
<body>

    <h2>Tabel Perkalian 8</h2>

    <script>
        let bilangan = 8;

        for (let i = 1; i <= 10; i++) {
            document.write(
                bilangan + " x " + i + " = " + (bilangan * i) + "<br>"
            );
        }
    </script>

</body>
</html>
