<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan Waktu</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
  <section>
        <a href="lat41.html">Latihan P4-1 </a>
  </section>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="mb-0">Tampilan Waktu</h3>
                    </div>

                    <div class="card-body p-4 text-center">
                        <p class="text-muted mb-2">Waktu Sekarang</p>

                        <h1 id="jam" class="text-primary fw-bold">
                            00:00:00
                        </h1>

                        <h5 id="tanggal" class="mt-3">
                            Memuat tanggal...
                        </h5>

                        <div class="mt-4">
                            <span class="badge bg-success">
                                Waktu Berjalan Otomatis
                            </span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript untuk menampilkan waktu -->
    <script>
        function tampilkanWaktu() {
            const sekarang = new Date();

            const waktu = sekarang.toLocaleTimeString("id-ID", {
                timeZone: "Asia/Jakarta",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            const tanggal = sekarang.toLocaleDateString("id-ID", {
                timeZone: "Asia/Jakarta",
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("jam").textContent = waktu;
            document.getElementById("tanggal").textContent = tanggal;
        }

        // Menampilkan waktu saat halaman dibuka
        tampilkanWaktu();

        // Memperbarui waktu setiap 1 detik
        setInterval(tampilkanWaktu, 1000);
    </script>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
