
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator - Eka Anisa</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    color: #202124;
    min-height: 100vh;
    padding: 25px 15px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 22px;
}

.header h1 {
    font-size: 27px;
    margin-bottom: 9px;
    color: #202124;
}

.header p {
    color: #5f6368;
    font-size: 14px;
    line-height: 1.6;
}

.identity {
    font-size: 13px !important;
    margin-top: 7px;
}

.calculator {
    background: white;
    border: 1px solid #dadce0;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(60,64,67,.12);
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.mode {
    display: flex;
    gap: 7px;
}

.mode button, .angle button {
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
    background: #f1f3f4;
    color: #3c4043;
    cursor: pointer;
    font-weight: 600;
}

.mode button.active,
.angle button.active {
    background: #d2e3fc;
    color: #174ea6;
}

.angle {
    display: flex;
    gap: 5px;
}

.display {
    min-height: 125px;
    border-bottom: 1px solid #dadce0;
    margin-bottom: 15px;
    padding: 15px 10px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
}

.expression {
    color: #5f6368;
    font-size: 19px;
    min-height: 28px;
    max-width: 100%;
    overflow-wrap: anywhere;
    text-align: right;
}

.result {
    font-size: 38px;
    font-weight: 400;
    margin-top: 8px;
    max-width: 100%;
    overflow-wrap: anywhere;
    text-align: right;
}

.error {
    color: #d93025;
    font-size: 14px;
    margin-top: 7px;
}

.memory {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.memory button {
    border: none;
    background: transparent;
    color: #5f6368;
    padding: 7px 12px;
    cursor: pointer;
    border-radius: 5px;
}

.memory button:hover {
    background: #f1f3f4;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.key {
    min-height: 53px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: #f1f3f4;
    color: #202124;
    font-size: 17px;
    cursor: pointer;
    transition: .15s;
}

.key:hover {
    background: #e8eaed;
}

.key.function {
    background: #d2e3fc;
    color: #174ea6;
    font-size: 15px;
}

.key.function:hover {
    background: #c2dbff;
}

.key.operator {
    background: #e8f0fe;
    color: #174ea6;
    font-size: 21px;
}

.key.equal {
    background: #4285f4;
    color: white;
    font-weight: bold;
}

.key.equal:hover {
    background: #1a73e8;
}

.key.clear {
    color: #d93025;
}

.history {
    margin-top: 20px;
    border-top: 1px solid #dadce0;
    padding-top: 15px;
}

.history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.history h3 {
    font-size: 16px;
}

.history button {
    border: none;
    background: transparent;
    color: #1a73e8;
    cursor: pointer;
}

.history-item {
    padding: 9px 5px;
    border-bottom: 1px solid #f1f3f4;
    text-align: right;
    cursor: pointer;
}

.history-item:hover {
    background: #f8f9fa;
}

.history-expression {
    font-size: 13px;
    color: #5f6368;
}

.history-result {
    font-size: 17px;
    margin-top: 3px;
}

.footer {
    text-align: center;
    color: #5f6368;
    font-size: 12px;
    margin-top: 20px;
}

@media(max-width: 520px) {
    body {
        padding: 15px 8px;
    }

    .calculator {
        padding: 10px;
    }

    .keypad {
        gap: 5px;
    }

    .key {
        min-height: 48px;
        font-size: 15px;
    }

    .key.function {
        font-size: 12px;
    }

    .result {
        font-size: 30px;
    }

    .mode button, .angle button {
        padding: 8px 10px;
        font-size: 12px;
    }
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>Scientific Calculator</h1>
        <p>UTS Project - Logika Algoritma</p>
        <p>Perjalanan belajar Logika Algoritma bersama Pa Iin TA 20261</p>
        <p class="identity">Eka Anisa - NIM. 262302018</p>
    </div>

    <div class="calculator">

        <div class="topbar">
            <div class="mode">
                <button id="basicMode" class="active" onclick="setMode('basic')">Basic</button>
                <button id="scientificMode" onclick="setMode('scientific')">Scientific</button>
            </div>

            <div class="angle">
                <button id="deg" class="active" onclick="setAngle('DEG')">DEG</button>
                <button id="rad" onclick="setAngle('RAD')">RAD</button>
            </div>
        </div>

        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
            <div class="error" id="error"></div>
        </div>

        <div class="memory">
            <button onclick="memoryClear()">MC</button>
            <button onclick="memoryRecall()">MR</button>
            <button onclick="memoryAdd()">M+</button>
            <button onclick="memorySubtract()">M−</button>
            <button onclick="memorySave()">MS</button>
        </div>

        <div class="keypad" id="keypad">

            <button class="key function" onclick="insert('(')">(</button>
            <button class="key function" onclick="insert(')')">)</button>
            <button class="key function" onclick="insert('pi')">π</button>
            <button class="key function" onclick="insert('e')">e</button>
            <button class="key clear" onclick="clearAll()">AC</button>

            <button class="key function" onclick="insert('sin(')">sin</button>
            <button class="key function" onclick="insert('cos(')">cos</button>
            <button class="key function" onclick="insert('tan(')">tan</button>
            <button class="key function" onclick="insert('sqrt(')">√</button>
            <button class="key clear" onclick="deleteLast()">DEL</button>

            <button class="key function" onclick="insert('log(')">log</button>
            <button class="key function" onclick="insert('ln(')">ln</button>
            <button class="key function" onclick="insert('!')">x!</button>
            <button class="key function" onclick="insert('^2')">x²</button>
            <button class="key function" onclick="insert('^3')">x³</button>

            <button class="key" onclick="insert('7')">7</button>
            <button class="key" onclick="insert('8')">8</button>
            <button class="key" onclick="insert('9')">9</button>
            <button class="key operator" onclick="insert('/')">÷</button>
            <button class="key operator" onclick="insert('%')">%</button>

            <button class="key" onclick="insert('4')">4</button>
            <button class="key" onclick="insert('5')">5</button>
            <button class="key" onclick="insert('6')">6</button>
            <button class="key operator" onclick="insert('*')">×</button>
            <button class="key operator" onclick="insert('^')">xʸ</button>

            <button class="key" onclick="insert('1')">1</button>
            <button class="key" onclick="insert('2')">2</button>
            <button class="key" onclick="insert('3')">3</button>
            <button class="key operator" onclick="insert('-')">−</button>
            <button class="key function" onclick="insert('ans')">Ans</button>

            <button class="key" onclick="insert('0')">0</button>
            <button class="key" onclick="insert('.')">.</button>
            <button class="key function" onclick="insert('abs(')">|x|</button>
            <button class="key operator" onclick="insert('+')">+</button>
            <button class="key equal" onclick="calculate()">=</button>

        </div>

        <div class="history">
            <div class="history-head">
                <h3>Riwayat Perhitungan</h3>
                <button onclick="clearHistory()">Hapus Riwayat</button>
            </div>
            <div id="historyList">
                <p style="color:#80868b;font-size:13px;">Belum ada riwayat perhitungan.</p>
            </div>
        </div>

    </div>

    <div class="footer">
        Eka Anisa - NIM. 262302018
    </div>

</div>

<script>
let expression = "";
let answer = 0;
let memory = 0;
let angleMode = "DEG";
let currentMode = "basic";
let historyData = [];

const expressionDisplay = document.getElementById("expression");
const resultDisplay = document.getElementById("result");
const errorDisplay = document.getElementById("error");

function updateDisplay() {
    expressionDisplay.textContent = expression
        .replaceAll("*", "×")
        .replaceAll("/", "÷")
        .replaceAll("-", "−")
        .replaceAll("pi", "π");

    errorDisplay.textContent = "";
}

function insert(value) {
    expression += value;
    updateDisplay();
}

function clearAll() {
    expression = "";
    resultDisplay.textContent = "0";
    updateDisplay();
}

function deleteLast() {
    expression = expression.slice(0, -1);
    updateDisplay();
}

function setAngle(mode) {
    angleMode = mode;
    document.getElementById("deg").classList.toggle("active", mode === "DEG");
    document.getElementById("rad").classList.toggle("active", mode === "RAD");
}

function setMode(mode) {
    currentMode = mode;

    document.getElementById("basicMode").classList.toggle("active", mode === "basic");
    document.getElementById("scientificMode").classList.toggle("active", mode === "scientific");

    const scientificButtons = document.querySelectorAll(
        ".key.function"
    );

    const scientificFunctions = [
        "sin(", "cos(", "tan(", "sqrt(", "log(", "ln(",
        "!", "^2", "^3", "pi", "e", "(", ")", "abs("
    ];

    scientificButtons.forEach(button => {
        const value = button.getAttribute("onclick");
        const isScientific = scientificFunctions.some(fn =>
            value && value.includes("'" + fn + "'")
        );

        button.style.display =
            mode === "basic" && isScientific ? "none" : "block";
    });
}

/* TOKENIZER */
function tokenize(input) {
    const tokens = [];
    const regex = /\s*([0-9]*\.?[0-9]+(?:e[+-]?[0-9]+)?|[a-zA-Z]+|[+\-*/%^!()]|\.)/gy;

    let position = 0;

    while (position < input.length) {
        regex.lastIndex = position;
        const match = regex.exec(input);

        if (!match) {
            throw new Error("Input tidak valid.");
        }

        tokens.push(match[1]);
        position = regex.lastIndex;
    }

    return tokens;
}

/* MATHEMATICAL PARSER */
function evaluate(input) {
    let tokens = tokenize(input);
    let index = 0;

    function peek() {
        return tokens[index];
    }

    function next() {
        return tokens[index++];
    }

    function expect(value) {
        if (next() !== value) {
            throw new Error("Tanda kurung tidak sesuai.");
        }
    }

    function factorial(n) {
        if (!Number.isInteger(n) || n < 0 || n > 170) {
            throw new Error("Faktorial hanya untuk bilangan bulat 0 sampai 170.");
        }

        let result = 1;
        for (let i = 2; i <= n; i++) {
            result *= i;
        }
        return result;
    }

    function primary() {
        let token = next();

        if (token === undefined) {
            throw new Error("Masukkan angka terlebih dahulu.");
        }

        if (token === "(") {
            let value = addition();
            expect(")");
            return value;
        }

        if (!isNaN(Number(token)) && token !== "") {
            return Number(token);
        }

        if (token === "pi") return Math.PI;
        if (token === "e") return Math.E;
        if (token === "ans") return answer;

        const functions = [
            "sin", "cos", "tan", "sqrt",
            "log", "ln", "abs"
        ];

        if (functions.includes(token)) {
            let value;

            if (peek() === "(") {
                next();
                value = addition();
                expect(")");
            } else {
                value = unary();
            }

            switch (token) {
                case "sin":
                    return Math.sin(angleMode === "DEG" ? value * Math.PI / 180 : value);

                case "cos":
                    return Math.cos(angleMode === "DEG" ? value * Math.PI / 180 : value);

                case "tan":
                    return Math.tan(angleMode === "DEG" ? value * Math.PI / 180 : value);

                case "sqrt":
                    if (value < 0) throw new Error("Akar negatif tidak valid.");
                    return Math.sqrt(value);

                case "log":
                    if (value <= 0) throw new Error("Log harus lebih dari 0.");
                    return Math.log10(value);

                case "ln":
                    if (value <= 0) throw new Error("Ln harus lebih dari 0.");
                    return Math.log(value);

                case "abs":
                    return Math.abs(value);
            }
        }

        throw new Error("Fungsi atau angka tidak dikenali.");
    }

    function postfix() {
        let value = primary();

        while (peek() === "!") {
            next();
            value = factorial(value);
        }

        return value;
    }

    function power() {
        let value = postfix();

        if (peek() === "^") {
            next();
            value = Math.pow(value, unary());
        }

        return value;
    }

    function unary() {
        if (peek() === "+") {
            next();
            return unary();
        }

        if (peek() === "-") {
            next();
            return -unary();
        }

        return power();
    }

    function startsPrimary(token) {
        return token !== undefined &&
            (
                token === "(" ||
                token === "pi" ||
                token === "e" ||
                token === "ans" ||
                /^[0-9]/.test(token) ||
                ["sin", "cos", "tan", "sqrt", "log", "ln", "abs"].includes(token)
            );
    }

    function multiplication() {
        let value = unary();

        while (true) {
            if (peek() === "*") {
                next();
                value *= unary();
            } else if (peek() === "/") {
                next();
                let divisor = unary();

                if (divisor === 0) {
                    throw new Error("Tidak bisa membagi dengan nol.");
                }

                value /= divisor;
            } else if (peek() === "%") {
                next();
                let divisor = unary();

                if (divisor === 0) {
                    throw new Error("Modulus dengan nol tidak valid.");
                }

                value %= divisor;
            } else if (startsPrimary(peek())) {
                value *= unary();
            } else {
                break;
            }
        }

        return value;
    }

    function addition() {
        let value = multiplication();

        while (peek() === "+" || peek() === "-") {
            let operator = next();
            let nextValue = multiplication();

            value = operator === "+"
                ? value + nextValue
                : value - nextValue;
        }

        return value;
    }

    let result = addition();

    if (index < tokens.length) {
        throw new Error("Periksa kembali rumus yang dimasukkan.");
    }

    if (!Number.isFinite(result)) {
        throw new Error("Hasil perhitungan tidak valid.");
    }

    return result;
}

/* CALCULATION */
function formatNumber(number) {
    if (Number.isInteger(number)) {
        return number.toLocaleString("en-US");
    }

    return Number(number.toPrecision(12)).toString();
}

function calculate() {
    if (expression.trim() === "") {
        errorDisplay.textContent = "Masukkan perhitungan terlebih dahulu.";
        return;
    }

    try {
        const result = evaluate(expression);
        answer = result;

        const formatted = formatNumber(result);
        resultDisplay.textContent = formatted;

        historyData.unshift({
            expression: expression,
            result: formatted
        });

        historyData = historyData.slice(0, 30);
        renderHistory();

        expression = String(result);
        updateDisplay();

    } catch (error) {
        errorDisplay.textContent = error.message;
    }
}

/* MEMORY */
function getCurrentValue() {
    if (expression === "") return answer;
    return evaluate(expression);
}

function memoryClear() {
    memory = 0;
}

function memoryRecall() {
    insert("(" + memory + ")");
}

function memoryAdd() {
    try {
        memory += getCurrentValue();
    } catch {
        errorDisplay.textContent = "Perhitungan memori tidak valid.";
    }
}

function memorySubtract() {
    try {
        memory -= getCurrentValue();
    } catch {
        errorDisplay.textContent = "Perhitungan memori tidak valid.";
    }
}

function memorySave() {
    try {
        memory = getCurrentValue();
    } catch {
        errorDisplay.textContent = "Perhitungan memori tidak valid.";
    }
}

/* HISTORY */
function renderHistory() {
    const list = document.getElementById("historyList");

    if (historyData.length === 0) {
        list.innerHTML =
            '<p style="color:#80868b;font-size:13px;">Belum ada riwayat perhitungan.</p>';
        return;
    }

    list.innerHTML = "";

    historyData.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";

        const exp = document.createElement("div");
        exp.className = "history-expression";
        exp.textContent = item.expression;

        const res = document.createElement("div");
        res.className = "history-result";
        res.textContent = item.result;

        div.appendChild(exp);
        div.appendChild(res);

        div.onclick = function() {
            expression = item.expression;
            updateDisplay();
        };

        list.appendChild(div);
    });
}

function clearHistory() {
    historyData = [];
    renderHistory();
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown", function(event) {
    const key = event.key;

    if (/^[0-9.]$/.test(key) || ["+", "-", "*", "/", "%", "^", "(", ")", "!"].includes(key)) {
        insert(key);
    } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
    } else if (key === "Backspace") {
        deleteLast();
    } else if (key === "Escape") {
        clearAll();
    }
});

setMode("scientific");
</script>

</body>
</html>
