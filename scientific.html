
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator - Eka Anisa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #f1f3f4;
            color: #202124;
        }

        .container {
            max-width: 480px;
            margin: 25px auto;
        }

        .header {
            margin-bottom: 18px;
        }

        .header h2 {
            margin: 0 0 7px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 13px;
        }

        .calculator {
            background: white;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .display {
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 10px;
            min-height: 105px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            overflow: hidden;
        }

        #expression {
            min-height: 25px;
            color: #777;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        #result {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 9px;
        }

        button {
            border: none;
            border-radius: 8px;
            min-height: 48px;
            font-size: 16px;
            cursor: pointer;
            background: #f1f3f4;
            color: #202124;
            transition: 0.15s;
        }

        button:hover {
            filter: brightness(0.94);
        }

        button:active {
            transform: scale(0.96);
        }

        .function {
            background: #e8f0fe;
            color: #1967d2;
        }

        .operator {
            background: #d2e3fc;
            color: #174ea6;
            font-weight: bold;
        }

        .clear {
            background: #fce8e6;
            color: #c5221f;
        }

        .equal {
            background: #1a73e8;
            color: white;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 17px;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 380px) {
            .calculator {
                padding: 12px;
            }

            .buttons {
                gap: 6px;
            }

            button {
                min-height: 43px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Scientific Calculator</h2>
        <p>Kalkulator Ilmiah - UTS Logika Algoritma</p>
    </div>

    <div class="calculator">

        <div class="display">
            <div id="expression">0</div>
            <div id="result">0</div>
        </div>

        <div class="buttons">

            <button class="clear" data-action="clear">AC</button>
            <button class="clear" data-action="backspace">DEL</button>
            <button class="function" data-insert="(">(</button>
            <button class="function" data-insert=")">)</button>
            <button class="operator" data-insert="/">÷</button>

            <button class="function" data-insert="sin(">sin</button>
            <button class="function" data-insert="cos(">cos</button>
            <button class="function" data-insert="tan(">tan</button>
            <button class="function" data-insert="sqrt(">√</button>
            <button class="operator" data-insert="^">xʸ</button>

            <button class="function" data-insert="log(">log</button>
            <button class="function" data-insert="ln(">ln</button>
            <button class="function" data-insert="π">π</button>
            <button class="function" data-insert="e">e</button>
            <button class="function" data-insert="!">n!</button>

            <button data-insert="7">7</button>
            <button data-insert="8">8</button>
            <button data-insert="9">9</button>
            <button class="operator" data-insert="*">×</button>
            <button class="operator" data-insert="%">mod</button>

            <button data-insert="4">4</button>
            <button data-insert="5">5</button>
            <button data-insert="6">6</button>
            <button class="operator" data-insert="-">−</button>
            <button class="function" data-insert="^2">x²</button>

            <button data-insert="1">1</button>
            <button data-insert="2">2</button>
            <button data-insert="3">3</button>
            <button class="operator" data-insert="+">+</button>
            <button class="function" data-insert=".">.</button>

            <button data-insert="0">0</button>
            <button data-insert="00">00</button>
            <button class="function" data-insert="π">π</button>
            <button class="function" data-insert="e">e</button>
            <button class="equal" data-action="calculate">=</button>

        </div>
    </div>

    <div class="footer">
        Eka Anisa - NIM. 262302018
    </div>

</div>

<script>
    const expressionDisplay = document.getElementById("expression");
    const resultDisplay = document.getElementById("result");

    let expression = "";
    let justCalculated = false;

    function updateDisplay() {
        expressionDisplay.textContent = expression || "0";
    }

    function insertValue(value) {
        if (justCalculated) {
            if (/^[0-9.]$/.test(value) || value === "00" ||
                value === "π" || value === "e" ||
                value.includes("(")) {
                expression = "";
            }
            justCalculated = false;
        }

        expression += value;
        updateDisplay();
        resultDisplay.textContent = "0";
    }

    function clearAll() {
        expression = "";
        justCalculated = false;
        expressionDisplay.textContent = "0";
        resultDisplay.textContent = "0";
    }

    function backspace() {
        expression = expression.slice(0, -1);
        justCalculated = false;
        updateDisplay();
        resultDisplay.textContent = "0";
    }

    // Mengubah ekspresi menjadi token
    function tokenize(input) {
        const pattern = /\s*([0-9]+(?:\.[0-9]*)?|\.[0-9]+(?:e[+-]?[0-9]+)?|[0-9]+(?:\.[0-9]*)?(?:e[+-]?[0-9]+)?|sin|cos|tan|sqrt|log|ln|π|e|[+\-*/%^()!])/igy;

        const tokens = [];
        let position = 0;

        while (position < input.length) {
            pattern.lastIndex = position;
            const match = pattern.exec(input);

            if (!match || match.index !== position) {
                throw new Error("Input tidak valid");
            }

            tokens.push(match[1]);
            position = pattern.lastIndex;
        }

        return tokens;
    }

    // Menghitung ekspresi dengan aturan prioritas matematika
    function evaluate(input) {
        const tokens = tokenize(input);
        let index = 0;

        function peek() {
            return tokens[index];
        }

        function consume() {
            return tokens[index++];
        }

        function factorial(number) {
            if (!Number.isInteger(number) || number < 0) {
                throw new Error("Faktorial hanya untuk bilangan bulat nonnegatif");
            }

            if (number > 170) {
                throw new Error("Angka faktorial terlalu besar");
            }

            let result = 1;

            for (let i = 2; i <= number; i++) {
                result *= i;
            }

            return result;
        }

        function parseExpression() {
            let value = parseTerm();

            while (peek() === "+" || peek() === "-") {
                const operator = consume();
                const right = parseTerm();

                value = operator === "+"
                    ? value + right
                    : value - right;
            }

            return value;
        }

        function parseTerm() {
            let value = parseUnary();

            while (["*", "/", "%"].includes(peek())) {
                const operator = consume();
                const right = parseUnary();

                if (operator === "/") {
                    if (right === 0) throw new Error("Tidak bisa dibagi nol");
                    value /= right;
                } else if (operator === "%") {
                    if (right === 0) throw new Error("Modulus dengan nol tidak bisa");
                    value %= right;
                } else {
                    value *= right;
                }
            }

            return value;
        }

        function parseUnary() {
            if (peek() === "+") {
                consume();
                return parseUnary();
            }

            if (peek() === "-") {
                consume();
                return -parseUnary();
            }

            return parsePower();
        }

        function parsePower() {
            let value = parsePostfix();

            if (peek() === "^") {
                consume();
                value = Math.pow(value, parseUnary());
            }

            return value;
        }

        function parsePostfix() {
            let value = parsePrimary();

            while (peek() === "!") {
                consume();
                value = factorial(value);
            }

            return value;
        }

        function parsePrimary() {
            const token = consume();

            if (token === undefined) {
                throw new Error("Ekspresi belum lengkap");
            }

            if (token === "(") {
                const value = parseExpression();

                if (consume() !== ")") {
                    throw new Error("Kurung belum lengkap");
                }

                return value;
            }

            if (["sin", "cos", "tan", "sqrt", "log", "ln"].includes(token)) {
                if (consume() !== "(") {
                    throw new Error("Fungsi harus menggunakan tanda kurung");
                }

                const value = parseExpression();

                if (consume() !== ")") {
                    throw new Error("Kurung fungsi belum lengkap");
                }

                switch (token) {
                    case "sin":
                        return Math.sin(value * Math.PI / 180);

                    case "cos":
                        return Math.cos(value * Math.PI / 180);

                    case "tan":
                        return Math.tan(value * Math.PI / 180);

                    case "sqrt":
                        if (value < 0) throw new Error("Akar bilangan negatif tidak valid");
                        return Math.sqrt(value);

                    case "log":
                        if (value <= 0) throw new Error("Log harus lebih dari nol");
                        return Math.log10(value);

                    case "ln":
                        if (value <= 0) throw new Error("Ln harus lebih dari nol");
                        return Math.log(value);
                }
            }

            if (token === "π") return Math.PI;
            if (token === "e") return Math.E;

            if (/^(\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(token)) {
                return Number(token);
            }

            throw new Error("Angka atau operator tidak valid");
        }

        const answer = parseExpression();

        if (index < tokens.length) {
            throw new Error("Periksa kembali ekspresi");
        }

        if (!Number.isFinite(answer)) {
            throw new Error("Hasil tidak valid");
        }

        return answer;
    }

    function calculate() {
        if (!expression) return;

        try {
            const answer = evaluate(expression);

            const formatted = Number(answer.toPrecision(12));

            expressionDisplay.textContent = expression + " =";
            resultDisplay.textContent = formatted.toString();

            expression = formatted.toString();
            justCalculated = true;

        } catch (error) {
            resultDisplay.textContent = "Error";
            expressionDisplay.textContent = error.message;
            justCalculated = true;
        }
    }

    // Tombol kalkulator
    document.querySelectorAll("[data-insert]").forEach(button => {
        button.addEventListener("click", () => {
            insertValue(button.dataset.insert);
        });
    });

    document.querySelectorAll("[data-action]").forEach(button => {
        button.addEventListener("click", () => {
            const action = button.dataset.action;

            if (action === "clear") clearAll();
            if (action === "backspace") backspace();
            if (action === "calculate") calculate();
        });
    });

    // Dukungan keyboard
    document.addEventListener("keydown", event => {
        if (/^[0-9.]$/.test(event.key)) {
            insertValue(event.key);
        } else if (["+", "-", "*", "/", "%", "^", "(", ")", "!"].includes(event.key)) {
            insertValue(event.key);
        } else if (event.key === "Enter" || event.key === "=") {
            event.preventDefault();
            calculate();
        } else if (event.key === "Backspace") {
            backspace();
        } else if (event.key === "Escape") {
            clearAll();
        }
    });
</script>

</body>
</html>
