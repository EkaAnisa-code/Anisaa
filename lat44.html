
<div class="container">
  <h1>Penentu Huruf Mutu</h1>
  <p class="subtitle">Masukkan nama dan nilai akhir kamu.</p>

  <label for="nama">Nama mahasiswa</label>
  <input type="text" id="nama" placeholder="Masukkan nama">

  <label for="nilai">Nilai akhir (0–100)</label>
  <input
    type="number"
    id="nilai"
    placeholder="Masukkan nilai akhir"
    min="0"
    max="100"
    step="any"
  >

  <button onclick="hitungNilai()">Periksa Nilai</button>

  <div id="hasil" class="hasil" aria-live="polite">
    Hasil huruf mutu akan muncul di sini.
  </div>
</div>
