
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
        }

        .kalkulator {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #hasil {
            font-size: 35px;
            font-weight: bold;
            color: #0d6efd;
            text-align: center;
            margin-top: 20px;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="kalkulator">

            <h2 class="text-center mb-4">Kalkulator</h2>

            <!-- Input Angka Pertama -->
            <div class="mb-3">
                <label class="form-label">Angka Pertama</label>
                <input type="number" id="angka1" class="form-control"
                    placeholder="Masukkan angka pertama">
            </div>

            <!-- Input Angka Kedua -->
            <div class="mb-3">
                <label class="form-label">Angka Kedua</label>
                <input type="number" id="angka2" class="form-control"
                    placeholder="Masukkan angka kedua">
            </div>

            <!-- Select Operator -->
            <div class="mb-3">
                <label class="form-label">Pilih Operator</label>
                <select id="operator" class="form-select">
                    <option value="+">Penjumlahan (+)</option>
                    <option value="-">Pengurangan (-)</option>
                    <option value="*">Perkalian (*)</option>
                    <option value="/">Pembagian (/)</option>
                    <option value="%">Modulus (%)</option>
                    <option value="**">Pangkat (**)</option>
                </select>
            </div>

            <!-- Tombol Hitung -->
            <button onclick="hitung()" class="btn btn-primary w-100">
                Hitung
            </button>

            <!-- Layar Hasil -->
            <h5 class="text-center mt-4">Hasil Perhitungan:</h5>
            <div id="hasil">0</div>

        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function hitung() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let operator = document.getElementById("operator").value;

            let hasil;

            if (angka1 === "" || angka2 === "") {
                document.getElementById("hasil").innerHTML =
                    "Masukkan kedua angka!";
                return;
            }

            angka1 = Number(angka1);
            angka2 = Number(angka2);

            switch (operator) {
                case "+":
                    hasil = angka1 + angka2;
                    break;

                case "-":
                    hasil = angka1 - angka2;
                    break;

                case "*":
                    hasil = angka1 * angka2;
                    break;

                case "/":
                    hasil = angka2 === 0 ? "Tidak bisa dibagi 0" : angka1 / angka2;
                    break;

                case "%":
                    hasil = angka2 === 0 ? "Tidak bisa modulus 0" : angka1 % angka2;
                    break;

                case "**":
                    hasil = angka1 ** angka2;
                    break;
            }

            document.getElementById("hasil").innerHTML = hasil;
        }
    </script>

</body>
</html>
