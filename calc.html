<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmatika Eka Anisa</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
        }

        .kalkulator {
            max-width: 500px;
            margin: 80px auto;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .judul {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .isi-kalkulator {
            padding: 30px;
            background-color: white;
        }

        .form-label,
        h5 {
            color: black;
        }

        .form-control,
        .form-select {
            background-color: white;
            color: black;
        }

        .btn-hitung {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }

        .btn-hitung:hover {
            background-color: #0b5ed7;
            color: white;
        }

        #hasil {
            background-color: black;
            color: white;
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            min-height: 70px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="kalkulator">

            <!-- Judul Biru -->
            <div class="judul">
                Kalkulator Aritmatika Eka Anisa - NIM 262302018
            </div>

            <!-- Isi Kalkulator Putih -->
            <div class="isi-kalkulator">

                <div class="mb-3">
                    <label class="form-label">Angka Pertama</label>
                    <input type="number" id="angka1" class="form-control"
                        placeholder="Masukkan angka pertama">
                </div>

                <div class="mb-3">
                    <label class="form-label">Angka Kedua</label>
                    <input type="number" id="angka2" class="form-control"
                        placeholder="Masukkan angka kedua">
                </div>

                <div class="mb-3">
                    <label class="form-label">Pilih Operator</label>
                    <select id="operator" class="form-select">
                        <option value="+">Penjumlahan (+)</option>
                        <option value="-">Pengurangan (-)</option>
                        <option value="*">Perkalian (*)</option>
                        <option value="/">Pembagian (/)</option>
                        <option value="%">Modulus (%)</option>
                        <option value="**">Pangkat (**)</option>
                    </select>
                </div>

                <!-- Tombol Hitung -->
                <button onclick="hitung()" class="btn btn-hitung w-100">
                    Hitung
                </button>

                <!-- Hasil Menyatu dalam Kotak Hitam -->
                <div id="hasil" class="mt-4">
                    <h5 style="color:white;">Hasil Perhitungan:</h5>
                    0
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function hitung() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let operator = document.getElementById("operator").value;

            let hasil;

            if (angka1 === "" || angka2 === "") {
                document.getElementById("hasil").innerHTML =
                    '<h5 style="color:white;">Hasil Perhitungan:</h5>Masukkan kedua angka!';
                return;
            }

            angka1 = Number(angka1);
            angka2 = Number(angka2);

            switch (operator) {
                case "+":
                    hasil = angka1 + angka2;
                    break;
                case "-":
                    hasil = angka1 - angka2;
                    break;
                case "*":
                    hasil = angka1 * angka2;
                    break;
                case "/":
                    hasil = angka2 === 0 ? "Tidak bisa dibagi 0" : angka1 / angka2;
                    break;
                case "%":
                    hasil = angka2 === 0 ? "Tidak bisa modulus 0" : angka1 % angka2;
                    break;
                case "**":
                    hasil = angka1 ** angka2;
                    break;
            }

            document.getElementById("hasil").innerHTML =
                '<h5 style="color:white;">Hasil Perhitungan:</h5>' + hasil;
        }
    </script>

</body>
</html>
