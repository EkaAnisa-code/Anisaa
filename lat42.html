
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Usia</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    #hasil {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      line-height: 1.6;
    }

    #hasil:empty {
      display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Kalkulator Usia</h1>

    <label for="tanggalLahir">
      Tanggal lahir kamu:
    </label>

    <input
      type="date"
      id="tanggalLahir"
      max=""
      value="2007-08-25"
    >

    <p id="hasil" aria-live="polite"></p>
  </main>

  <script>
    const input = document.getElementById("tanggalLahir");
    const hasil = document.getElementById("hasil");

    function tanggalLokal(date = new Date()) {
      const tahun = date.getFullYear();
      const bulan = String(date.getMonth() + 1).padStart(2, "0");
      const hari = String(date.getDate()).padStart(2, "0");

      return `${tahun}-${bulan}-${hari}`;
    }

    function hitungUsia() {
      const nilai = input.value;
      const sekarang = new Date();
      input.max = tanggalLokal(sekarang);

      if (!nilai || nilai > input.max) {
        hasil.textContent = "";
        return;
      }

      const [tahun, bulan, hari] = nilai.split("-").map(Number);
      const lahir = new Date(tahun, bulan - 1, hari);

      // Pastikan tanggal benar-benar valid.
      if (
        lahir.getFullYear() !== tahun ||
        lahir.getMonth() !== bulan - 1 ||
        lahir.getDate() !== hari
      ) {
        hasil.textContent = "";
        return;
      }

      let usiaTahun =
        sekarang.getFullYear() - tahun;
      let usiaBulan =
        sekarang.getMonth() - (bulan - 1);
      let usiaHari =
        sekarang.getDate() - hari;

      if (usiaHari < 0) {
        usiaBulan--;

        const hariBulanSebelumnya = new Date(
          sekarang.getFullYear(),
          sekarang.getMonth(),
          0
        ).getDate();

        usiaHari += hariBulanSebelumnya;
      }

      if (usiaBulan < 0) {
        usiaTahun--;
        usiaBulan += 12;
      }

      hasil.textContent =
        `Kamu sudah berusia ${usiaTahun} tahun ` +
        `${usiaBulan} bulan ${usiaHari} hari.`;
    }

    input.addEventListener("input", hitungUsia);
    input.addEventListener("change", hitungUsia);

    hitungUsia();
  </script>
</body>
</html>
