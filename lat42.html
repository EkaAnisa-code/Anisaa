
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Usia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f5d0fe);
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .description {
      color: #6b7280;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input[type="date"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input[type="date"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px #e0e7ff;
    }

    #hasil {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #eef2ff;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #hasil strong {
      color: #4338ca;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Kalkulator Usia 🎂</h1>

    <p class="description">
      Cari tahu berapa usia kamu hari ini!
    </p>

    <label for="tanggalLahir">
      Tanggal lahir kamu:
    </label>

    <input
      type="date"
      id="tanggalLahir"
      value="2008-03-12"
      required
    >

    <p id="hasil" aria-live="polite">
      Menghitung usia...
    </p>

    <p class="footer">
      Dibuat dengan HTML, CSS, dan JavaScript
    </p>
  </main>

  <script>
    const input = document.getElementById("tanggalLahir");
    const hasil = document.getElementById("hasil");

    function formatTanggal(date) {
      const tahun = date.getFullYear();
      const bulan = String(date.getMonth() + 1).padStart(2, "0");
      const hari = String(date.getDate()).padStart(2, "0");

      return `${tahun}-${bulan}-${hari}`;
    }

    function hitungUsia() {
      const nilai = input.value;

      // Gunakan tanggal lokal agar tidak bergeser karena zona waktu.
      const hariIni = new Date();
      hariIni.setHours(0, 0, 0, 0);

      input.max = formatTanggal(hariIni);

      if (!nilai) {
        hasil.textContent = "Silakan pilih tanggal lahir kamu.";
        return;
      }

      const [tahun, bulan, hari] = nilai.split("-").map(Number);
      const lahir = new Date(tahun, bulan - 1, hari);

      // Pastikan tanggal benar-benar valid.
      if (
        lahir.getFullYear() !== tahun ||
        lahir.getMonth() !== bulan - 1 ||
        lahir.getDate() !== hari
      ) {
        hasil.textContent = "Tanggal lahir tidak valid.";
        return;
      }

      if (lahir > hariIni) {
        hasil.textContent = "Tanggal lahir tidak boleh di masa depan.";
        return;
      }

      let tahunUsia = hariIni.getFullYear() - tahun;
      let bulanUsia = hariIni.getMonth() - (bulan - 1);
      let hariUsia = hariIni.getDate() - hari;

      if (hariUsia < 0) {
        bulanUsia--;
        const jumlahHariBulanLalu = new Date(
          hariIni.getFullYear(),
          hariIni.getMonth(),
          0
        ).getDate();

        hariUsia += jumlahHariBulanLalu;
      }

      if (bulanUsia < 0) {
        tahunUsia--;
        bulanUsia += 12;
      }

      hasil.replaceChildren();

      const paragraf = document.createElement("span");
      paragraf.textContent =
        `Kamu sudah berusia ${tahunUsia} tahun ` +
        `${bulanUsia} bulan ${hariUsia} hari.`;

      hasil.appendChild(paragraf);
    }

    input.addEventListener("input", hitungUsia);

    hitungUsia();
  </script>
</body>
</html>
