<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Eka Anisa</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f7fa;
        }

        .biodata-card {
            max-width: 600px;
            margin: 50px auto;
            border: none;
            border-radius: 20px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            color: white;
            padding: 35px 20px;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            background-color: white;
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .biodata-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .biodata-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card shadow biodata-card">

            <!-- Header -->
            <div class="header text-center">
                <div class="profile-icon">
                    EA
                </div>

                <h1 class="h3 fw-bold mb-1">Eka Anisa</h1>
                <p class="mb-0">Biodata Mahasiswa</p>
            </div>

            <!-- Biodata -->
            <div class="card-body p-4">

                <div class="biodata-item row">
                    <div class="col-5 col-sm-4 fw-bold">Nama</div>
                    <div class="col-7 col-sm-8">Eka Anisa</div>
                </div>

                <div class="biodata-item row">
                    <div class="col-5 col-sm-4 fw-bold">Kelas</div>
                    <div class="col-7 col-sm-8">Komputerisasi Akuntansi</div>
                </div>

                <div class="biodata-item row">
                    <div class="col-5 col-sm-4 fw-bold">Semester</div>
                    <div class="col-7 col-sm-8">1</div>
                </div>

            </div>

            <!-- Footer -->
            <div class="card-footer text-center text-muted">
                <small>&copy; 2026 Eka Anisa</small>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
